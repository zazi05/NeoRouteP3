name: Build and Test

on:
  push:
    branches: [ main, master, Part2, part2 ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore NeoRoute.sln

      - name: Build
        run: dotnet build NeoRoute.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test NeoRoute.API.Tests/NeoRoute.API.Tests.csproj --configuration Release --no-build --verbosity normal
